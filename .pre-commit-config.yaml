repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # -x follows `source` from disk. Without it the result depends on which
        # files the commit happens to touch, since every script sources log.sh.
        args: [-x]

  - repo: local
    hooks:
      - id: rust-fmt
        name: cargo fmt
        entry: scripts/format.sh --check
        language: script
        pass_filenames: false
        types: [rust]

      - id: rust-lint
        name: cargo clippy
        entry: scripts/lint.sh
        language: script
        pass_filenames: false
        types: [rust]

      - id: rust-test
        name: cargo test
        entry: scripts/test.sh
        language: script
        pass_filenames: false
        types: [rust]
