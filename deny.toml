# Supply-chain policy for `cargo deny check`, run by scripts/audit.sh.
# Docs: https://embarkstudios.github.io/cargo-deny/checks/index.html

[licenses]
# Permissive licenses only. Do not add a copyleft license here without
# understanding its obligations for a distributed binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list above is a policy statement, not a description of the current
# graph. Don't warn about entries no dependency happens to use yet.
unused-allowed-license = "allow"

[bans]
# Duplicate versions bloat the binary but are rarely actionable in a
# transitive graph, so they warn rather than fail.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
